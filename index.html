<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harry Potter et les insectes magiques</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Trebuchet MS", Arial, sans-serif;
    background:
        radial-gradient(circle at 50% 20%, #344d8b 0%, #151b3c 45%, #080b1d 100%);
    color: white;
    text-align: center;
    overflow-x: hidden;
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .7;
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(#b9c9ff 1px, transparent 1px),
        radial-gradient(#ffffff 1px, transparent 1px);
    background-size: 80px 80px, 130px 130px, 210px 210px;
    background-position: 10px 20px, 50px 70px, 90px 120px;
    animation: starsMove 20s linear infinite;
}

@keyframes starsMove {
    from { transform: translateY(0); }
    to { transform: translateY(-80px); }
}

header {
    position: relative;
    padding: 30px 15px 10px;
    z-index: 2;
}

h1 {
    font-size: clamp(28px, 6vw, 52px);
    margin: 5px 0;
    color: #ffd75a;
    text-shadow:
        0 0 5px #fff,
        0 0 15px #ffd75a,
        0 0 35px #ff9d00;
    animation: titleGlow 2s infinite alternate;
}

@keyframes titleGlow {
    from {
        text-shadow:
            0 0 5px #fff,
            0 0 15px #ffd75a;
    }
    to {
        text-shadow:
            0 0 10px #fff,
            0 0 30px #ffd75a,
            0 0 55px #ff8c00;
    }
}

.subtitle {
    font-size: 19px;
    color: #e8e8ff;
}

.game {
    position: relative;
    max-width: 1000px;
    margin: auto;
    padding: 15px;
    z-index: 2;
}

.characters {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin: 20px 0;
}

.character {
    background: #ffffff12;
    border: 2px solid #ffffff30;
    border-radius: 20px;
    padding: 12px 25px;
    cursor: pointer;
    transition: .3s;
    font-size: 20px;
    backdrop-filter: blur(8px);
}

.character:hover {
    transform: translateY(-5px) scale(1.05);
    background: #ffd84d25;
    border-color: #ffd75a;
    box-shadow:
        0 0 15px #ffd75a,
        0 0 35px #ffd75a55;
}

.character.selected {
    transform: scale(1.08);
    background: linear-gradient(135deg, #ffd75a33, #7d5cff44);
    border-color: #ffd75a;
    box-shadow:
        0 0 15px #ffd75a,
        0 0 40px #7d5cff88;
}

.scene {
    position: relative;
    min-height: 370px;
    background:
        radial-gradient(
            circle at center,
            #39477f,
            #1b2148 45%,
            #11152f 100%
        );
    border: 3px solid #d7b65a;
    border-radius: 35px;
    box-shadow:
        0 10px 40px #0008,
        inset 0 0 40px #0008;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    margin: 20px auto 30px;
    overflow: hidden;
}

.scene::before {
    content: "";
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, #8d7aff22, transparent 70%);
    animation: halo 3s infinite alternate;
}

@keyframes halo {
    from {
        transform: scale(.8);
        opacity: .4;
    }
    to {
        transform: scale(1.3);
        opacity: 1;
    }
}

.magic-circle {
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 3px solid #b99cff;
    box-shadow:
        0 0 10px #b99cff,
        0 0 30px #7d5cff,
        inset 0 0 20px #7d5cff;
    opacity: .65;
    transform: rotate(0deg);
    transition: .5s;
}

.magic-circle::before,
.magic-circle::after {
    content: "";
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    border: 2px dashed #ffd75a;
}

.magic-circle::after {
    inset: 40px;
    border: 2px solid #ffffff88;
}

.magic-circle.active {
    animation:
        magicRotate 2s linear infinite,
        circlePulse .7s infinite alternate;
}

@keyframes magicRotate {
    to {
        transform: rotate(360deg);
    }
}

@keyframes circlePulse {
    from {
        box-shadow:
            0 0 10px #b99cff,
            0 0 30px #7d5cff;
    }
    to {
        box-shadow:
            0 0 25px #fff,
            0 0 70px #9b7cff,
            0 0 100px #7d5cff;
    }
}

.magic {
    position: relative;
    z-index: 3;
    font-size: 24px;
    color: #ffd75a;
    min-height: 35px;
    text-shadow: 0 0 10px #ffd75a;
}

.avatar {
    position: relative;
    z-index: 3;
    font-size: 105px;
    margin: 25px;
    filter:
        drop-shadow(0 0 15px #fff6)
        drop-shadow(0 0 25px #7d5cff66);
    transition: .3s;
}

.avatar.transforming {
    animation: epicTransformation 1.8s cubic-bezier(.2,.8,.2,1);
}

@keyframes epicTransformation {
    0% {
        transform: scale(1) rotate(0deg);
        filter:
            brightness(1)
            drop-shadow(0 0 15px #fff);
    }

    15% {
        transform: scale(1.25) rotate(-8deg);
        filter:
            brightness(1.8)
            drop-shadow(0 0 25px #ffd75a);
    }

    30% {
        transform: scale(1.5) rotate(15deg);
        filter:
            brightness(3)
            drop-shadow(0 0 45px #ffe45c);
    }

    48% {
        transform: scale(.15) rotate(180deg);
        opacity: .2;
        filter:
            brightness(5)
            drop-shadow(0 0 60px white);
    }

    62% {
        transform: scale(.05) rotate(360deg);
        opacity: 0;
    }

    75% {
        transform: scale(.6) rotate(500deg);
        opacity: 1;
        filter:
            brightness(3)
            drop-shadow(0 0 50px #8fffa5);
    }

    88% {
        transform: scale(1.25) rotate(700deg);
        filter:
            brightness(1.8)
            drop-shadow(0 0 35px #8fffa5);
    }

    100% {
        transform: scale(1) rotate(720deg);
        filter:
            brightness(1)
            drop-shadow(0 0 20px #8fffa5);
    }
}

.insect-name {
    position: relative;
    z-index: 3;
    font-size: 30px;
    font-weight: bold;
    color: #8fffa5;
    min-height: 45px;
    text-shadow: 0 0 10px #8fffa5;
    transition: .3s;
}

.insect-name.pop {
    animation: namePop .6s ease-out;
}

@keyframes namePop {
    0% {
        transform: scale(.2);
        opacity: 0;
    }
    60% {
        transform: scale(1.2);
        opacity: 1;
    }
    100% {
        transform: scale(1);
    }
}

.question {
    font-size: 22px;
    margin: 15px;
    text-shadow: 0 0 10px #fff;
}

.insects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 15px;
    max-width: 850px;
    margin: auto;
}

.insect {
    position: relative;
    border: none;
    border-radius: 20px;
    background: linear-gradient(145deg, #ffffff, #dce4ff);
    color: #172044;
    padding: 18px 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 12px #0005;
    transition: .25s;
    overflow: hidden;
}

.insect::before {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    background: #ffffff88;
    border-radius: 50%;
    top: -60px;
    left: -40px;
    transition: .4s;
}

.insect:hover::before {
    transform: scale(3);
}

.insect:hover {
    transform: translateY(-8px) scale(1.05);
    box-shadow:
        0 10px 25px #0008,
        0 0 20px #9b8cff;
}

.insect:active {
    transform: scale(.92);
}

.insect span {
    display: block;
    font-size: 45px;
    margin-bottom: 7px;
    transition: .3s;
}

.insect:hover span {
    transform: rotate(10deg) scale(1.2);
}

.message {
    margin-top: 25px;
    min-height: 45px;
    font-size: 23px;
    font-weight: bold;
}

.success {
    color: #76ff9b;
    text-shadow: 0 0 10px #76ff9b;
}

.error {
    color: #ff8585;
}

.score {
    margin-top: 20px;
    font-size: 20px;
    color: #ffd75a;
    text-shadow: 0 0 10px #ffd75a;
}

.reset {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, #7d5cff, #bd65ff);
    color: white;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 5px 20px #7d5cff66;
    transition: .3s;
}

.reset:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 8px 30px #bd65ff99;
}

.flash {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(
            circle,
            white 0%,
            #fff7a0 15%,
            #9d7cff55 40%,
            transparent 70%
        );
    pointer-events: none;
    z-index: 50;
    animation: flash .5s ease-out forwards;
}

@keyframes flash {
    0% { opacity: 0; }
    30% { opacity: .95; }
    100% { opacity: 0; }
}

.sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 25px;
    z-index: 60;
    animation: sparkleExplosion 1.3s forwards;
}

@keyframes sparkleExplosion {
    0% {
        transform:
            translate(0,0)
            scale(0)
            rotate(0deg);
        opacity: 1;
    }

    100% {
        transform:
            translate(
                calc(var(--x) * 1px),
                calc(var(--y) * 1px)
            )
            scale(1.8)
            rotate(360deg);
        opacity: 0;
    }
}

.smoke {
    position: absolute;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            #ffffffcc,
            #b8b8ff66,
            transparent
        );
    pointer-events: none;
    z-index: 10;
    animation: smokeAnimation 1.4s ease-out forwards;
}

@keyframes smokeAnimation {
    0% {
        transform: scale(.3) translateY(0);
        opacity: .9;
    }

    100% {
        transform: scale(3) translateY(-130px);
        opacity: 0;
    }
}

@media(max-width:600px) {
    .scene {
        min-height: 330px;
    }

    .avatar {
        font-size: 80px;
    }

    .magic-circle {
        width: 180px;
        height: 180px;
    }

    .insect-name {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="stars"></div>

<header>
    <h1>✨ Harry Potter et les insectes magiques ✨</h1>

    <div class="subtitle">
        Choisis un sorcier puis lance un sort spectaculaire !
    </div>
</header>

<main class="game">

    <div class="characters">

        <div
            class="character selected"
            onclick="chooseCharacter('Harry','🧙‍♂️', this)"
        >
            🧙‍♂️ Harry
        </div>

        <div
            class="character"
            onclick="chooseCharacter('Hermione','🧙‍♀️', this)"
        >
            🧙‍♀️ Hermione
        </div>

        <div
            class="character"
            onclick="chooseCharacter('Ron','🧙', this)"
        >
            🧙 Ron
        </div>

    </div>

    <section class="scene">

        <div
            class="magic-circle"
            id="magicCircle"
        ></div>

        <div
            class="magic"
            id="magic"
        >
            ✨ À toi de jouer ! ✨
        </div>

        <div
            class="avatar"
            id="avatar"
        >
            🧙‍♂️
        </div>

        <div
            class="insect-name"
            id="insectName"
        >
            Prêt pour la magie ?
        </div>

    </section>

    <div class="question">
        ✨ Quel insecte veux-tu faire apparaître ?
    </div>

    <div class="insects">

        <button
            class="insect"
            onclick="transform('Coccinelle','🐞')"
        >
            <span>🐞</span>
            Coccinelle
        </button>

        <button
            class="insect"
            onclick="transform('Abeille','🐝')"
        >
            <span>🐝</span>
            Abeille
        </button>

        <button
            class="insect"
            onclick="transform('Fourmi','🐜')"
        >
            <span>🐜</span>
            Fourmi
        </button>

        <button
            class="insect"
            onclick="transform('Frelon','🐝')"
        >
            <span>🐝</span>
            Frelon
        </button>

        <button
            class="insect"
            onclick="transform('Moustique','🦟')"
        >
            <span>🦟</span>
            Moustique
        </button>

        <button
            class="insect"
            onclick="transform('Scarabée','🪲')"
        >
            <span>🪲</span>
            Scarabée
        </button>

        <button
            class="insect"
            onclick="transform('Papillon','🦋')"
        >
            <span>🦋</span>
            Papillon
        </button>

    </div>

    <div
        class="message"
        id="message"
    ></div>

    <div class="score">
        🏆 Transformations réussies :
        <span id="score">0</span>
    </div>

    <button
        class="reset"
        onclick="resetGame()"
    >
        🔄 Recommencer
    </button>

</main>

<script>

let character = "Harry";
let characterEmoji = "🧙‍♂️";
let score = 0;
let transforming = false;

function chooseCharacter(name, emoji, element) {

    if (transforming) return;

    character = name;
    characterEmoji = emoji;

    const avatar = document.getElementById("avatar");

    avatar.textContent = emoji;

    document
        .querySelectorAll(".character")
        .forEach(c => {
            c.classList.remove("selected");
        });

    element.classList.add("selected");

    document.getElementById("magic").textContent =
        "✨ " + character +
        " est prêt à lancer le sort ! ✨";

    document.getElementById("insectName").textContent =
        "Choisis un insecte 🪄";

    document.getElementById("message").textContent = "";
}

function transform(insect, emoji) {

    if (transforming) return;

    transforming = true;

    const avatar = document.getElementById("avatar");
    const insectName = document.getElementById("insectName");
    const magic = document.getElementById("magic");
    const message = document.getElementById("message");
    const circle = document.getElementById("magicCircle");

    message.textContent = "";
    message.className = "message";

    magic.textContent =
        "✨ " + character +
        " lance le sort : METAMORPHOSIS ! ✨";

    circle.classList.add("active");

    avatar.classList.remove("transforming");

    void avatar.offsetWidth;

    avatar.classList.add("transforming");

    createMagicParticles();
    createSmoke();

    setTimeout(() => {
        createFlash();
        createMagicParticles();
    }, 650);

    setTimeout(() => {

        avatar.textContent = emoji;

        insectName.textContent =
            character +
            " s'est transformé(e) en " +
            insect +
            " !";

        insectName.classList.remove("pop");

        void insectName.offsetWidth;

        insectName.classList.add("pop");

        magic.textContent =
            "✨ MAGIE RÉUSSIE ! ✨";

        message.textContent =
            "Bravo ! Quelle incroyable transformation ! 🎉";

        message.className =
            "message success";

        score++;

        document.getElementById("score").textContent =
            score;

        createExplosion();

    }, 900);

    setTimeout(() => {

        circle.classList.remove("active");

        avatar.classList.remove("transforming");

        transforming = false;

    }, 1800);
}

function createFlash() {

    const flash = document.createElement("div");

    flash.className = "flash";

    document.body.appendChild(flash);

    setTimeout(() => {
        flash.remove();
    }, 600);
}

function createMagicParticles() {

    const symbols = [
        "✨",
        "⭐",
        "💫",
        "🔮",
        "🪄"
    ];

    for (let i = 0; i < 20; i++) {

        const sparkle =
            document.createElement("div");

        sparkle.className = "sparkle";

        sparkle.textContent =
            symbols[
                Math.floor(
                    Math.random() * symbols.length
                )
            ];

        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            100 + Math.random() * 280;

        sparkle.style.left = "50%";
        sparkle.style.top = "45%";

        sparkle.style.setProperty(
            "--x",
            Math.cos(angle) * distance
        );

        sparkle.style.setProperty(
            "--y",
            Math.sin(angle) * distance
        );

        document.body.appendChild(sparkle);

        setTimeout(() => {
            sparkle.remove();
        }, 1400);
    }
}

function createExplosion() {

    const symbols = [
        "✨",
        "⭐",
        "💫",
        "🎉",
        "🌟",
        "🪄"
    ];

    for (let i = 0; i < 35; i++) {

        const sparkle =
            document.createElement("div");

        sparkle.className = "sparkle";

        sparkle.textContent =
            symbols[
                Math.floor(
                    Math.random() * symbols.length
                )
            ];

        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            150 + Math.random() * 400;

        sparkle.style.left = "50%";
        sparkle.style.top = "45%";

        sparkle.style.fontSize =
            (15 + Math.random() * 25) + "px";

        sparkle.style.setProperty(
            "--x",
            Math.cos(angle) * distance
        );

        sparkle.style.setProperty(
            "--y",
            Math.sin(angle) * distance
        );

        document.body.appendChild(sparkle);

        setTimeout(() => {
            sparkle.remove();
        }, 1400);
    }
}

function createSmoke() {

    for (let i = 0; i < 15; i++) {

        const smoke =
            document.createElement("div");

        smoke.className = "smoke";

        smoke.style.left =
            (40 + Math.random() * 20) + "%";

        smoke.style.top =
            (45 + Math.random() * 15) + "%";

        smoke.style.animationDelay =
            (Math.random() * .4) + "s";

        document
            .querySelector(".scene")
            .appendChild(smoke);

        setTimeout(() => {
            smoke.remove();
        }, 1800);
    }
}

function resetGame() {

    transforming = false;

    score = 0;

    document.getElementById("score").textContent =
        score;

    document.getElementById("avatar").textContent =
        characterEmoji;

    document.getElementById("insectName").textContent =
        "Prêt pour une nouvelle transformation ?";

    document.getElementById("magic").textContent =
        "✨ À toi de jouer ! ✨";

    document.getElementById("message").textContent =
        "";

    document.getElementById("message").className =
        "message";

    document
        .getElementById("magicCircle")
        .classList.remove("active");
}

</script>

</body>
</html>
