<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harry Potter et les insectes magiques</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Trebuchet MS", Arial, sans-serif;
    background: #151b3c;
    color: white;
    text-align: center;
    overflow-x: hidden;
}

/* Base : Effets complets */
body:not(.light-mode) {
    background: radial-gradient(circle at 50% 20%, #344d8b 0%, #151b3c 45%, #080b1d 100%);
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .7;
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(#b9c9ff 1px, transparent 1px),
        radial-gradient(#ffffff 1px, transparent 1px);
    background-size: 80px 80px, 130px 130px, 210px 210px;
    background-position: 10px 20px, 50px 70px, 90px 120px;
    animation: starsMove 20s linear infinite;
}

@keyframes starsMove {
    from { transform: translateY(0); }
    to { transform: translateY(-80px); }
}

/* Bouton Mode Léger & Alerte */
.mode-toggle {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 100;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid #ffd75a;
    color: #ffd75a;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: 0.3s;
    backdrop-filter: blur(5px);
}

.mode-toggle:hover {
    background: #ffd75a;
    color: #151b3c;
}

.lag-warning {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #ff4757;
    color: white;
    padding: 12px 20px;
    border-radius: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    z-index: 200;
    display: none;
    font-weight: bold;
    cursor: pointer;
    animation: popIn 0.3s ease-out;
}

@keyframes popIn {
    from { transform: translate(-50%, 50px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
}

header {
    position: relative;
    padding: 40px 15px 10px;
    z-index: 2;
}

h1 {
    font-size: clamp(28px, 6vw, 52px);
    margin: 5px 0;
    color: #ffd75a;
    text-shadow:
        0 0 5px #fff,
        0 0 15px #ffd75a,
        0 0 35px #ff9d00;
}

body:not(.light-mode) h1 {
    animation: titleGlow 2s infinite alternate;
}

@keyframes titleGlow {
    from { text-shadow: 0 0 5px #fff, 0 0 15px #ffd75a; }
    to { text-shadow: 0 0 10px #fff, 0 0 30px #ffd75a, 0 0 55px #ff8c00; }
}

.subtitle {
    font-size: 19px;
    color: #e8e8ff;
}

.game {
    position: relative;
    max-width: 1000px;
    margin: auto;
    padding: 15px;
    z-index: 2;
}

.characters {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin: 20px 0;
}

.character {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 10px 20px;
    cursor: pointer;
    transition: .3s;
    font-size: 20px;
    backdrop-filter: blur(8px);
}

.char-btn-img {
    width: 35px;
    height: 35px;
    object-fit: cover;
    border-radius: 50%;
}

.character:hover {
    transform: translateY(-5px) scale(1.05);
    background: rgba(255, 215, 90, 0.15);
    border-color: #ffd75a;
    box-shadow: 0 0 15px #ffd75a, 0 0 35px rgba(255, 215, 90, 0.3);
}

.character.selected {
    transform: scale(1.08);
    background: linear-gradient(135deg, rgba(255, 215, 90, 0.2), rgba(125, 92, 255, 0.2));
    border-color: #ffd75a;
    box-shadow: 0 0 15px #ffd75a, 0 0 40px rgba(125, 92, 255, 0.5);
}

.scene {
    position: relative;
    min-height: 370px;
    background: #1b2148;
    border: 3px solid #d7b65a;
    border-radius: 35px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    margin: 20px auto 30px;
    overflow: hidden;
}

body:not(.light-mode) .scene {
    background: radial-gradient(circle at center, #39477f, #1b2148 45%, #11152f 100%);
    box-shadow: 0 10px 40px #0008, inset 0 0 40px #0008;
}

body:not(.light-mode) .scene::before {
    content: "";
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(141, 122, 255, 0.15), transparent 70%);
    animation: halo 3s infinite alternate;
}

@keyframes halo {
    from { transform: scale(.8); opacity: .4; }
    to { transform: scale(1.3); opacity: 1; }
}

.magic-circle {
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 3px solid #b99cff;
    box-shadow: 0 0 10px #b99cff, 0 0 30px #7d5cff, inset 0 0 20px #7d5cff;
    opacity: .65;
    transition: .5s;
}

.magic-circle::before,
.magic-circle::after {
    content: "";
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    border: 2px dashed #ffd75a;
}

.magic-circle::after {
    inset: 40px;
    border: 2px solid rgba(255, 255, 255, 0.5);
}

.magic-circle.active {
    animation: magicRotate 2s linear infinite, circlePulse .7s infinite alternate;
}

@keyframes magicRotate {
    to { transform: rotate(360deg); }
}

@keyframes circlePulse {
    from { box-shadow: 0 0 10px #b99cff, 0 0 30px #7d5cff; }
    to { box-shadow: 0 0 25px #fff, 0 0 70px #9b7cff, 0 0 100px #7d5cff; }
}

.magic {
    position: relative;
    z-index: 3;
    font-size: 24px;
    color: #ffd75a;
    min-height: 35px;
    text-shadow: 0 0 10px #ffd75a;
}

.avatar {
    position: relative;
    z-index: 3;
    width: 130px;
    height: 130px;
    margin: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 95px;
    filter: drop-shadow(0 0 15px rgba(255,255,255,0.4)) drop-shadow(0 0 25px rgba(125,92,255,0.4));
    transition: .3s;
}

.avatar-img-container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.avatar img {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid #ffd75a;
}

.avatar.transforming {
    animation: simplePulse 0.5s ease-in-out;
}

body:not(.light-mode) .avatar.transforming {
    animation: epicTransformation 1.8s cubic-bezier(.2,.8,.2,1);
}

@keyframes simplePulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
}

@keyframes epicTransformation {
    0% { transform: scale(1) rotate(0deg); filter: brightness(1) drop-shadow(0 0 15px #fff); }
    15% { transform: scale(1.25) rotate(-8deg); filter: brightness(1.8) drop-shadow(0 0 25px #ffd75a); }
    30% { transform: scale(1.5) rotate(15deg); filter: brightness(3) drop-shadow(0 0 45px #ffe45c); }
    48% { transform: scale(.15) rotate(180deg); opacity: .2; filter: brightness(5) drop-shadow(0 0 60px white); }
    62% { transform: scale(.05) rotate(360deg); opacity: 0; }
    75% { transform: scale(.6) rotate(500deg); opacity: 1; filter: brightness(3) drop-shadow(0 0 50px #8fffa5); }
    88% { transform: scale(1.25) rotate(700deg); filter: brightness(1.8) drop-shadow(0 0 35px #8fffa5); }
    100% { transform: scale(1) rotate(720deg); filter: brightness(1) drop-shadow(0 0 20px #8fffa5); }
}

.insect-name {
    position: relative;
    z-index: 3;
    font-size: 30px;
    font-weight: bold;
    color: #8fffa5;
    min-height: 45px;
    text-shadow: 0 0 10px #8fffa5;
}

.insect-name.pop {
    animation: namePop .6s ease-out;
}

@keyframes namePop {
    0% { transform: scale(.2); opacity: 0; }
    60% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); }
}

.question {
    font-size: 22px;
    margin: 15px;
    text-shadow: 0 0 10px #fff;
}

.insects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 15px;
    max-width: 850px;
    margin: auto;
}

.insect {
    position: relative;
    border: none;
    border-radius: 20px;
    background: linear-gradient(145deg, #ffffff, #dce4ff);
    color: #172044;
    padding: 18px 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 12px #0005;
    transition: .25s;
    overflow: hidden;
}

.insect:hover {
    transform: translateY(-8px) scale(1.05);
    box-shadow: 0 10px 25px #0008, 0 0 20px #9b8cff;
}

.insect span {
    display: block;
    font-size: 45px;
    margin-bottom: 7px;
    transition: .3s;
}

.insect:hover span {
    transform: rotate(10deg) scale(1.2);
}

.message {
    margin-top: 25px;
    min-height: 45px;
    font-size: 23px;
    font-weight: bold;
}

.success { color: #76ff9b; text-shadow: 0 0 10px #76ff9b; }

.score {
    margin-top: 20px;
    font-size: 20px;
    color: #ffd75a;
    text-shadow: 0 0 10px #ffd75a;
}

.reset {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, #7d5cff, #bd65ff);
    color: white;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(125, 92, 255, 0.4);
    transition: .3s;
}

.reset:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 8px 30px rgba(189, 101, 255, 0.6);
}

/* Particules / Effets lourds */
.flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, white 0%, #fff7a0 15%, rgba(157, 124, 255, 0.3) 40%, transparent 70%);
    pointer-events: none;
    z-index: 50;
    animation: flash .5s ease-out forwards;
}

@keyframes flash {
    0% { opacity: 0; }
    30% { opacity: .95; }
    100% { opacity: 0; }
}

.sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 25px;
    z-index: 60;
    animation: sparkleExplosion 1.3s forwards;
}

@keyframes sparkleExplosion {
    0% { transform: translate(0,0) scale(0) rotate(0deg); opacity: 1; }
    100% { transform: translate(calc(var(--x) * 1px), calc(var(--y) * 1px)) scale(1.8) rotate(360deg); opacity: 0; }
}

.smoke {
    position: absolute;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.8), rgba(184,184,255,0.4), transparent);
    pointer-events: none;
    z-index: 10;
    animation: smokeAnimation 1.4s ease-out forwards;
}

@keyframes smokeAnimation {
    0% { transform: scale(.3) translateY(0); opacity: .9; }
    100% { transform: scale(3) translateY(-130px); opacity: 0; }
}

/* SPECIFIQUE MODE LIGHT (Allégé au maximum) */
body.light-mode .stars,
body.light-mode .sparkle,
body.light-mode .smoke,
body.light-mode .flash,
body.light-mode .scene::before {
    display: none !important;
}

body.light-mode * {
    text-shadow: none !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
}

body.light-mode .magic-circle {
    box-shadow: none !important;
}

body.light-mode .insect:hover {
    transform: none;
}
</style>
</head>

<body>

<button class="mode-toggle" id="modeBtn" onclick="toggleLightMode()">⚡ Mode Léger : OFF</button>
<div class="lag-warning" id="lagWarning" onclick="enableLightModeAuto()">🐢 Ralentissement détecté ! Cliquez ici pour passer en Mode Léger</div>

<div class="stars"></div>

<header>
    <h1>✨ Harry Potter et les insectes magiques ✨</h1>
    <div class="subtitle">Choisis un sorcier puis lance un sort spectaculaire !</div>
</header>

<main class="game">

    <div class="characters">
        <div class="character selected" onclick="chooseCharacter('Harry', 'images/harry.jpg', this)">
            <img src="images/harry.jpg" alt="Harry" class="char-btn-img"> Harry
        </div>
        <div class="character" onclick="chooseCharacter('Hermione', 'images/hermione.jpg', this)">
            <img src="images/hermione.jpg" alt="Hermione" class="char-btn-img"> Hermione
        </div>
        <div class="character" onclick="chooseCharacter('Ron', 'images/ron.jpg', this)">
            <img src="images/ron.jpg" alt="Ron" class="char-btn-img"> Ron
        </div>
    </div>

    <section class="scene">
        <div class="magic-circle" id="magicCircle"></div>
        <div class="magic" id="magic">✨ À toi de jouer ! ✨</div>
        <div class="avatar" id="avatar">
            <div class="avatar-img-container">
                <img src="images/harry.jpg" id="avatarImg" alt="Harry">
            </div>
        </div>
        <div class="insect-name" id="insectName">Prêt pour la magie ?</div>
    </section>

    <div class="question">✨ Quel insecte veux-tu faire apparaître ?</div>

    <div class="insects">
        <button class="insect" onclick="transform('Coccinelle','🐞')"><span>🐞</span>Coccinelle</button>
        <button class="insect" onclick="transform('Abeille','🐝')"><span>🐝</span>Abeille</button>
        <button class="insect" onclick="transform('Fourmi','🐜')"><span>🐜</span>Fourmi</button>
        <button class="insect" onclick="transform('Frelon','🐝')"><span>🐝</span>Frelon</button>
        <button class="insect" onclick="transform('Moustique','🦟')"><span>🦟</span>Moustique</button>
        <button class="insect" onclick="transform('Scarabée','🪲')"><span>🪲</span>Scarabée</button>
        <button class="insect" onclick="transform('Papillon','🦋')"><span>🦋</span>Papillon</button>
    </div>

    <div class="message" id="message"></div>
    <div class="score">🏆 Transformations réussies : <span id="score">0</span></div>
    <button class="reset" onclick="resetGame()">🔄 Recommencer</button>

</main>

<script>
let character = "Harry";
let characterImg = "images/harry.jpg";
let score = 0;
let transforming = false;
let isLightMode = false;

// --- DÉTECTEUR DE LENTEUR (FPS) ---
let lastFrameTime = performance.now();
let frameCount = 0;
let lagDetected = false;

function checkPerformance() {
    const now = performance.now();
    const delta = now - lastFrameTime;
    frameCount++;

    if (delta >= 1000) {
        const fps = (frameCount * 1000) / delta;
        frameCount = 0;
        lastFrameTime = now;

        // Si moins de 25 images par seconde et mode normal actif
        if (fps < 25 && !isLightMode && !lagDetected) {
            lagDetected = true;
            document.getElementById("lagWarning").style.display = "block";
        }
    }
    requestAnimationFrame(checkPerformance);
}
requestAnimationFrame(checkPerformance);

function enableLightModeAuto() {
    if (!isLightMode) toggleLightMode();
    document.getElementById("lagWarning").style.display = "none";
}

function toggleLightMode() {
    isLightMode = !isLightMode;
    document.body.classList.toggle("light-mode", isLightMode);
    document.getElementById("modeBtn").textContent = isLightMode ? "⚡ Mode Léger : ON" : "⚡ Mode Léger : OFF";
    if (isLightMode) {
        document.getElementById("lagWarning").style.display = "none";
    }
}

function chooseCharacter(name, imgSrc, element) {
    if (transforming) return;
    character = name;
    characterImg = imgSrc;

    document.getElementById("avatar").innerHTML = `<div class="avatar-img-container"><img src="${imgSrc}" id="avatarImg" alt="${name}"></div>`;
    document.querySelectorAll(".character").forEach(c => c.classList.remove("selected"));
    element.classList.add("selected");

    document.getElementById("magic").textContent = "✨ " + character + " est prêt à lancer le sort ! ✨";
    document.getElementById("insectName").textContent = "Choisis un insecte 🪄";
    document.getElementById("message").textContent = "";
}

function transform(insect, emoji) {
    if (transforming) return;
    transforming = true;

    const avatar = document.getElementById("avatar");
    const insectName = document.getElementById("insectName");
    const magic = document.getElementById("magic");
    const message = document.getElementById("message");
    const circle = document.getElementById("magicCircle");

    message.textContent = "";
    message.className = "message";
    magic.textContent = "✨ " + character + " lance le sort : METAMORPHOSIS ! ✨";

    circle.classList.add("active");
    avatar.classList.remove("transforming");
    void avatar.offsetWidth;
    avatar.classList.add("transforming");

    if (!isLightMode) {
        createMagicParticles();
        createSmoke();
        setTimeout(() => createFlash(), 650);
    }

    const delay = isLightMode ? 300 : 900;

    setTimeout(() => {
        avatar.textContent = emoji;
        insectName.textContent = character + " s'est transformé(e) en " + insect + " !";
        
        insectName.classList.remove("pop");
        void insectName.offsetWidth;
        if (!isLightMode) insectName.classList.add("pop");

        magic.textContent = "✨ MAGIE RÉUSSIE ! ✨";
        message.textContent = "Bravo ! Quelle incroyable transformation ! 🎉";
        message.className = "message success";

        score++;
        document.getElementById("score").textContent = score;

        if (!isLightMode) createExplosion();
    }, delay);

    setTimeout(() => {
        circle.classList.remove("active");
        avatar.classList.remove("transforming");
        transforming = false;
    }, isLightMode ? 500 : 1800);
}

function createFlash() {
    const flash = document.createElement("div");
    flash.className = "flash";
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 600);
}

function createMagicParticles() {
    const symbols = ["✨", "⭐", "💫", "🔮", "🪄"];
    for (let i = 0; i < 20; i++) {
        const sparkle = document.createElement("div");
        sparkle.className = "sparkle";
        sparkle.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        const angle = Math.random() * Math.PI * 2;
        const distance = 100 + Math.random() * 280;
        sparkle.style.left = "50%";
        sparkle.style.top = "45%";
        sparkle.style.setProperty("--x", Math.cos(angle) * distance);
        sparkle.style.setProperty("--y", Math.sin(angle) * distance);
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 1400);
    }
}

function createExplosion() {
    const symbols = ["✨", "⭐", "💫", "🎉", "🌟", "🪄"];
    for (let i = 0; i < 35; i++) {
        const sparkle = document.createElement("div");
        sparkle.className = "sparkle";
        sparkle.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        const angle = Math.random() * Math.PI * 2;
        const distance = 150 + Math.random() * 400;
        sparkle.style.left = "50%";
        sparkle.style.top = "45%";
        sparkle.style.fontSize = (15 + Math.random() * 25) + "px";
        sparkle.style.setProperty("--x", Math.cos(angle) * distance);
        sparkle.style.setProperty("--y", Math.sin(angle) * distance);
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 1400);
    }
}

function createSmoke() {
    for (let i = 0; i < 15; i++) {
        const smoke = document.createElement("div");
        smoke.className = "smoke";
        smoke.style.left = (40 + Math.random() * 20) + "%";
        smoke.style.top = (45 + Math.random() * 15) + "%";
        smoke.style.animationDelay = (Math.random() * .4) + "s";
        document.querySelector(".scene").appendChild(smoke);
        setTimeout(() => smoke.remove(), 1800);
    }
}

function resetGame() {
    transforming = false;
    score = 0;
    document.getElementById("score").textContent = score;
    document.getElementById("avatar").innerHTML = `<div class="avatar-img-container"><img src="${characterImg}" id="avatarImg" alt="${character}"></div>`;
    document.getElementById("insectName").textContent = "Prêt pour une nouvelle transformation ?";
    document.getElementById("magic").textContent = "✨ À toi de jouer ! ✨";
    document.getElementById("message").textContent = "";
    document.getElementById("message").className = "message";
    document.getElementById("magicCircle").classList.remove("active");
}
</script>

</body>
</html>
